[tool.poetry]
name = "s3-notification-process"
version = "0.1.0"
description = "S3 notification processor Lambda"
authors = []
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
boto3 = ">=1.34.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=8.0.0"
pytest-cov = ">=5.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
