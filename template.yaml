AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: S3 notification processor

Globals:
  Function:
    Timeout: 30
    MemorySize: 128
    Runtime: python3.12
    Environment:
      Variables:
        LOG_LEVEL: INFO

Parameters:
  QueueArnSecretId:
    Type: String
    Description: Secrets Manager secret ID whose SecretString contains the SQS queue ARN
    Default: s3-notification-process/queue-arn
  RoleArnSecretId:
    Type: String
    Description: Secrets Manager secret ID whose SecretString contains the Lambda execution role ARN
    Default: s3-notification-process/role-arn

Resources:
  S3ProcessorFunction:
    Type: AWS::Serverless::Function
    Metadata:
      BuildMethod: makefile
    Properties:
      CodeUri: .
      Handler: handlers.s3_processor.lambda_handler
      Description: Processes S3 event notifications
      Role: !Sub "{{resolve:secretsmanager:${RoleArnSecretId}:SecretString:role_arn}}"
      Events:
        SQSEvent:
          Type: SQS
          Properties:
            Queue: !Sub "{{resolve:secretsmanager:${QueueArnSecretId}:SecretString:queue_arn}}"
            BatchSize: 10

Outputs:
  S3ProcessorFunction:
    Description: Lambda function ARN
    Value: !GetAtt S3ProcessorFunction.Arn